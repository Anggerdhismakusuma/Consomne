<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consommé AI | Professional Access</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .gatekeeper-card {
            text-align: center;
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .icon-lock {
            font-size: 50px;
            margin-bottom: 20px;
        }
        h2 { margin-bottom: 10px; color: #fff; }
        p { color: #ccc; margin-bottom: 30px; font-size: 0.9em; }
        .btn-verify {
            background: #e94560;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-verify:hover {
            background: #ff5e78;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4);
        }
    </style>
</head>
<body>
    <div class="gatekeeper-card">
        <div class="icon-lock">🔒</div>
        <h2>Consommé AI</h2>
        <p>Aplikasi ini dirancang khusus untuk menganalisis kualitas tidur para pekerja profesional.</p>
        
        <form id="verifyForm">
            <p>Apakah Anda seorang pekerja profesional?</p>
            <button type="button" class="btn-verify" onclick="verifyAccess()">Ya, Saya Pekerja</button>
        </form>
    </div>

    <script>
        function verifyAccess() {
            fetch('/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ is_employed: 'yes' })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    // Redirect ke halaman utama aplikasi
                    window.location.href = '/app';
                } else {
                    alert('Maaf, akses ditolak.');
                }
            })
            .catch(error => console.error('Error:', error));
        }
    </script>
</body>
</html>
