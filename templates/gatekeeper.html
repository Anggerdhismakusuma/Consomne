<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consommé AI | Access Control</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <style>
        .gatekeeper-card {
            text-align: center;
            max-width: 450px;
            margin: 100px auto;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .btn-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }
        .btn {
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            border: none;
            flex: 1;
        }
        .btn-yes { background: #e94560; color: white; }
        .btn-no { background: #4e4e4e; color: white; }
        .btn:hover { opacity: 0.8; transform: translateY(-2px); }
        #access-denied {
            color: #ff4d4d;
            margin-top: 20px;
            display: none; /* Sembunyi dulu */
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="gatekeeper-card">
        <div class="icon-lock" style="font-size: 50px;">🔒</div>
        <h2>Welcome to Consommé AI</h2>
        <p>Aplikasi ini khusus untuk analisis kualitas tidur pekerja profesional.</p>
        <hr style="border: 0.5px solid rgba(255,255,255,0.1); margin: 20px 0;">
        <p><strong>Apakah Anda seorang pekerja?</strong></p>
        
        <div class="btn-container">
            <button class="btn btn-yes" onclick="verifyAccess(true)">Ya, Saya Pekerja</button>
            <button class="btn btn-no" onclick="verifyAccess(false)">Bukan Pekerja</button>
        </div>

        <div id="access-denied">
            ❌ Akses Ditolak. Aplikasi ini hanya untuk kalangan profesional.
        </div>
    </div>

    <script>
        function verifyAccess(isWorker) {
            const errorMsg = document.getElementById('access-denied');
            
            if (!isWorker) {
                errorMsg.style.display = 'block';
                return;
            }

            fetch('/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ is_employed: 'yes' })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    window.location.href = '/app';
                }
            })
            .catch(error => console.error('Error:', error));
        }
    </script>
</body>
</html>
